<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ニュースの現在地</title>

  <style>
    :root {
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#17202a;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#2563eb;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI","Noto Sans JP",sans-serif;
    }

    header {
      background:#111827;
      color:white;
      padding:18px 16px;
    }

    .header-inner {
      max-width:900px;
      margin:auto;
    }

    .logo {
      font-size:20px;
      font-weight:800;
    }

    .subtitle {
      margin-top:5px;
      font-size:12px;
      color:#cbd5e1;
    }

    main {
      max-width:900px;
      margin:auto;
      padding:22px 14px 50px;
    }

    .top {
      margin-bottom:20px;
    }

    h1 {
      font-size:25px;
      margin:0 0 7px;
    }

    .description {
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    #status {
      font-size:13px;
      color:var(--muted);
      margin:15px 0;
    }

    .event {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:17px;
      margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
    }

    .event-label {
      display:inline-block;
      font-size:11px;
      font-weight:700;
      color:var(--accent);
      background:#eff6ff;
      border-radius:999px;
      padding:4px 8px;
      margin-bottom:8px;
    }

    .event h2 {
      font-size:18px;
      line-height:1.45;
      margin:0 0 8px;
    }

    .count {
      font-size:12px;
      color:var(--muted);
      margin-bottom:12px;
    }

    .articles {
      border-top:1px solid var(--line);
      padding-top:8px;
    }

    .article {
      padding:9px 0;
      border-bottom:1px solid var(--line);
    }

    .article:last-child {
      border-bottom:0;
    }

    .article a {
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      line-height:1.5;
    }

    .article a:hover {
      color:var(--accent);
    }

    .date {
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }

    .error {
      background:#fff;
      border:1px solid #fecaca;
      border-radius:12px;
      padding:15px;
      color:#991b1b;
    }

    footer {
      text-align:center;
      color:var(--muted);
      font-size:11px;
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">ニュースの現在地</div>
    <div class="subtitle">
      バラバラの報道を、ひとつの出来事として追う
    </div>
  </div>
</header>

<main>

  <div class="top">
    <h1>札幌のニュース</h1>

    <div class="description">
      複数の報道をAIで整理し、
      同じ事件・出来事ごとにまとめています。
    </div>
  </div>

  <div id="status">
    ニュースを読み込んでいます…
  </div>

  <div id="news"></div>

</main>

<footer>
  ニュースの現在地 β
</footer>

<script>

async function loadNews() {

  const status = document.getElementById("status");
  const newsArea = document.getElementById("news");

  try {

    const response = await fetch(
  "events.json?time=" + Date.now()
);

    if (!response.ok) {
      throw new Error("データを取得できませんでした");
    }

    const groups = await response.json();

    const visibleGroups = groups.filter(group =>
  group.category !== "対象外" &&
  group.tracking_value !== "low"
);

status.textContent =
  visibleGroups.length + "件の出来事を表示しています";

    const filters = document.createElement("div");
filters.id = "category-filters";
filters.style.display = "flex";
filters.style.gap = "8px";
filters.style.flexWrap = "wrap";
filters.style.margin = "16px 0 20px";

status.insertAdjacentElement("afterend", filters);

    const categories = [
  "すべて",
  "事件・事故",
  "災害",
  "政策・制度",
  "企業・組織",
  "地域・インフラ"
];

categories.forEach(categoryName => {
  const button = document.createElement("button");
  button.textContent = categoryName;
  button.style.padding = "7px 12px";
  button.style.border = "1px solid #e4e7ec";
  button.style.borderRadius = "999px";
  button.style.background = categoryName === "すべて" ? "#2563eb" : "#ffffff";
  button.style.color = categoryName === "すべて" ? "#ffffff" : "#475467";
  button.style.fontWeight = "700";
  button.style.fontSize = "12px";
  button.style.cursor = "pointer";

  button.addEventListener("click", () => {

  filters.querySelectorAll("button").forEach(btn => {
  btn.style.background = "#ffffff";
  btn.style.color = "#475467";
});

button.style.background = "#2563eb";
button.style.color = "#ffffff";
    
  const cards = newsArea.querySelectorAll(".event");

  cards.forEach(card => {
    if (
      categoryName === "すべて" ||
      card.dataset.category === categoryName
    ) {
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
  });
    const shownCount = newsArea.querySelectorAll(
  '.event:not([style*="display: none"])'
).length;

status.textContent =
  shownCount + "件の出来事を表示しています";
});
  
  filters.appendChild(button);
});

    groups.forEach((group, index) => {

      if (
  group.category === "対象外" ||
  group.tracking_value === "low"
) return;

      const card = document.createElement("section");
      card.className = "event";
      card.dataset.category = group.category;

      const label = document.createElement("div");
      label.className = "event-label";
      label.textContent = "追跡中";

      const category = document.createElement("span");
category.textContent = group.category || "対象外";
category.style.display = "inline-block";
category.style.marginLeft = "8px";
category.style.padding = "4px 8px";
category.style.borderRadius = "999px";
category.style.fontSize = "11px";
category.style.fontWeight = "700";
category.style.background = "#f2f4f7";
category.style.color = "#475467";

      const title = document.createElement("h2");
      title.textContent =
        group.event_name || "名称未設定";

      const count = document.createElement("div");
      count.className = "count";
      const sourceCount = group.source_article_count || group.article_count;

if (sourceCount > group.article_count) {
  count.textContent =
    sourceCount + "件の報道を" + group.article_count + "件に整理";
} else {
  count.textContent =
    group.article_count + "件の関連記事";
}

      const statusBox = document.createElement("div");
statusBox.style.margin = "12px 0";
statusBox.style.padding = "14px";
statusBox.style.background = "#f8fafc";
statusBox.style.borderRadius = "10px";
statusBox.style.lineHeight = "1.7";

statusBox.innerHTML = `
  <div style="font-weight:800;margin-bottom:8px;">
    📍 現在地：${group.current_stage || "確認中"}
  </div>

  <div style="font-size:14px;margin-bottom:12px;">
    ${group.summary || ""}
  </div>

  <div style="font-size:13px;margin-bottom:8px;">
    <strong>最新の動き</strong><br>
    ${group.latest || "確認中"}
  </div>

  <div style="font-size:13px;">
    <strong>🔭 次に注目</strong><br>
    ${group.next_watch || "確認中"}
  </div>
`;
      
      const articles = document.createElement("div");
      articles.className = "articles";

      group.articles.forEach(article => {

        const item = document.createElement("div");
        item.className = "article";

        const link = document.createElement("a");
        link.href = article.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = article.title;

        const date = document.createElement("div");
        date.className = "date";

        if (article.published) {
          const d = new Date(article.published);

          if (!isNaN(d)) {
            date.textContent =
              d.toLocaleString("ja-JP");
          }
        }

        item.appendChild(link);
        item.appendChild(date);

        articles.appendChild(item);

      });

      card.appendChild(label);
      card.appendChild(category);
      card.appendChild(title);
      card.appendChild(count);
      card.appendChild(statusBox);
      card.appendChild(articles);

      newsArea.appendChild(card);

    });

  } catch (error) {

    status.textContent = "";

    newsArea.innerHTML =
      '<div class="error">' +
      'ニュースを読み込めませんでした。' +
      '</div>';

    console.error(error);

  }

}


loadNews();

</script>

</body>
</html>
