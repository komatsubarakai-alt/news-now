<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ニュースの現在地</title>

  <style>
    :root {
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#17202a;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#2563eb;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI","Noto Sans JP",sans-serif;
    }

    header {
      background:#111827;
      color:white;
      padding:18px 16px;
    }

    .header-inner {
      max-width:900px;
      margin:auto;
    }

    .logo {
      font-size:20px;
      font-weight:800;
    }

    .subtitle {
      margin-top:5px;
      font-size:12px;
      color:#cbd5e1;
    }

    main {
      max-width:900px;
      margin:auto;
      padding:22px 14px 50px;
    }

    .top {
      margin-bottom:20px;
    }

    h1 {
      font-size:25px;
      margin:0 0 7px;
    }

    .description {
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    #status {
      font-size:13px;
      color:var(--muted);
      margin:15px 0;
    }

    .event {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:17px;
      margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
    }

    .event-label {
      display:inline-block;
      font-size:11px;
      font-weight:700;
      color:var(--accent);
      background:#eff6ff;
      border-radius:999px;
      padding:4px 8px;
      margin-bottom:8px;
    }

    .event h2 {
      font-size:18px;
      line-height:1.45;
      margin:0 0 8px;
    }

    .count {
      font-size:12px;
      color:var(--muted);
      margin-bottom:12px;
    }

    .articles {
      border-top:1px solid var(--line);
      padding-top:8px;
    }

    .article {
      padding:9px 0;
      border-bottom:1px solid var(--line);
    }

    .article:last-child {
      border-bottom:0;
    }

    .article a {
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      line-height:1.5;
    }

    .article a:hover {
      color:var(--accent);
    }

    .date {
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }

    .error {
      background:#fff;
      border:1px solid #fecaca;
      border-radius:12px;
      padding:15px;
      color:#991b1b;
    }

    footer {
      text-align:center;
      color:var(--muted);
      font-size:11px;
      padding:20px;
    }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    button, summary { cursor:pointer; }
    button { padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:white; color:var(--text); }
    button[aria-pressed="true"] { background:var(--accent); color:white; }
    input[type="search"] { width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
    .status-box, .plans { padding:14px; background:#f8fafc; border-radius:10px; margin:12px 0; line-height:1.7; }
    .status-box p { margin:8px 0 14px; }
    details { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; line-height:1.7; }
    a { overflow-wrap:anywhere; }
    :focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">ニュースの現在地</div>
    <div class="subtitle">
      バラバラの報道を、ひとつの出来事として追う
    </div>
  </div>
</header>

<main>

  <div class="top">
    <h1>札幌のニュース</h1>

    <div class="description">
      複数の報道をAIで整理し、
      同じ事件・出来事ごとにまとめています。
    </div>
  </div>

  <div id="status">
    ニュースを読み込んでいます…
  </div>

  <div id="news"></div>

</main>

<footer>
  ニュースの現在地 v1.0 · 報道のタイトルからAIが整理しています。詳細は各記事で確認してください。
</footer>

<script>
const lifecycleLabels = {active: '追跡中', dormant: '休眠中', completed: '完結・保管'};
const categories = ['すべて', '事件・事故', '災害', '政策・制度', '企業・組織', '地域・インフラ'];
let events = [], selectedCategory = 'すべて', selectedLifecycle = 'active', searchText = '';
const status = document.getElementById('status');
const newsArea = document.getElementById('news');
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function formatDate(value) {
  const d = new Date(value);
  return value && !isNaN(d) ? d.toLocaleDateString('ja-JP', {timeZone: 'Asia/Tokyo'}) : '日時未確認';
}
function safeLink(url, title) {
  const node = element('a', title);
  try {
    const parsed = new URL(url);
    if (['https:', 'http:'].includes(parsed.protocol)) {
      node.href = parsed.href; node.target = '_blank'; node.rel = 'noopener noreferrer';
    }
  } catch (_) {}
  return node;
}
function makeFilters(values, initial, onChange, name) {
  const area = element('div', undefined, 'filters');
  area.setAttribute('aria-label', name);
  for (const [value, label] of values) {
    const button = element('button', label);
    button.type = 'button';
    button.setAttribute('aria-pressed', String(value === initial));
    button.addEventListener('click', () => {
      area.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      button.setAttribute('aria-pressed', 'true'); onChange(value); render();
    });
    area.appendChild(button);
  }
  return area;
}
function render() {
  newsArea.replaceChildren();
  const visible = events.filter(e => categories.slice(1).includes(e.category) && e.tracking_value !== 'low')
    .filter(e => selectedCategory === 'すべて' || e.category === selectedCategory)
    .filter(e => selectedLifecycle === 'all' || (e.lifecycle || 'active') === selectedLifecycle)
    .filter(e => !searchText || [e.event_name, e.summary, ...(e.articles || []).map(a => a.title)].join(' ').includes(searchText))
    .sort((a, b) => (Date.parse(b.updated_at) || 0) - (Date.parse(a.updated_at) || 0));
  status.textContent = visible.length + '件の出来事を表示しています';
  if (!visible.length) newsArea.appendChild(element('p', '条件に合う出来事はありません。', 'description'));
  for (const event of visible) {
    const card = element('section', undefined, 'event');
    if (event.event_id) card.id = 'event-' + event.event_id;
    card.append(element('span', lifecycleLabels[event.lifecycle || 'active'] || '確認中', 'event-label'),
      element('span', ' ' + event.category, 'description'), element('h2', event.event_name || '名称未設定'));
    const count = (event.articles || []).length;
    card.appendChild(element('div', '最終進展：' + formatDate(event.updated_at) + ' ／ ' + count + '件の関連記事 ／ 進展' + (event.progress_count || 0) + '回', 'count'));
    const box = element('div', undefined, 'status-box');
    box.append(element('strong', '📍 現在地：' + (event.current_stage || '確認中')), element('p', event.summary || '確認中'),
      element('strong', '最新の動き'), element('p', event.latest || '確認中'), element('strong', '次に注目'), element('p', event.next_watch || '確認中'));
    card.appendChild(box);
    if (event.lifecycle === 'dormant') card.appendChild(element('p', '長期間、重要な進展が確認されていません。続報で追跡を再開します。', 'description'));
    if (event.lifecycle === 'completed') card.appendChild(element('p', '完結を確認して保管中です。新たな進展があれば追跡を再開します。', 'description'));
    if ((event.schedules || []).length) {
      const plans = element('div', undefined, 'plans'); plans.appendChild(element('strong', '今後の予定・確認待ち'));
      for (const plan of event.schedules) {
        const item = element('p');
        let label = ({scheduled: '予定', completed: '実施確認', cancelled: '中止確認'})[plan.status] || '確認中';
        const end = plan.due_end && new Date(plan.due_end + 'T23:59:59+09:00');
        if (plan.status === 'scheduled' && end && end < new Date()) label = '予定時期を経過・実施確認待ち';
        item.append(element('span', plan.label + ' — ' + label + '：'), safeLink(plan.source_url, plan.date_text));
        plans.appendChild(item);
      }
      card.appendChild(plans);
    }
    if ((event.progress_history || []).length) {
      const details = element('details'); details.appendChild(element('summary', '出来事の進展を見る（' + event.progress_history.length + '回）'));
      for (const change of event.progress_history) {
        const item = element('p', formatDate(change.at) + '：' + change.stage + ' — ' + (change.latest || ''));
        for (const url of change.evidence_urls || []) item.append(' ', safeLink(url, '根拠記事'));
        details.appendChild(item);
      }
      card.appendChild(details);
    }
    const timeline = element('details'); timeline.appendChild(element('summary', 'これまでの報道を見る（' + count + '件）'));
    const articles = [...(event.articles || [])].sort((a, b) => (Date.parse(a.published) || 0) - (Date.parse(b.published) || 0));
    for (const article of articles) {
      const item = element('div', undefined, 'article');
      item.append(element('div', formatDate(article.published), 'date'), safeLink(article.url, article.title || '関連記事'));
      timeline.appendChild(item);
    }
    card.appendChild(timeline); newsArea.appendChild(card);
  }
}
async function loadNews() {
  try {
    const response = await fetch('events.json?time=' + Date.now());
    if (!response.ok) throw new Error('data load failed');
    events = await response.json();
    if (!Array.isArray(events)) throw new Error('invalid data');
    const controls = element('div');
    controls.appendChild(makeFilters(Object.entries(lifecycleLabels).concat([['all', 'すべての状態']]), selectedLifecycle, v => selectedLifecycle = v, '追跡状態'));
    controls.appendChild(makeFilters(categories.map(c => [c, c]), selectedCategory, v => selectedCategory = v, 'カテゴリー'));
    const input = element('input'); input.type = 'search'; input.placeholder = '出来事・記事を検索'; input.setAttribute('aria-label', '出来事・記事を検索');
    input.addEventListener('input', () => { searchText = input.value.trim(); render(); });
    controls.appendChild(input); status.insertAdjacentElement('beforebegin', controls);
    render();
    try {
      const healthResponse = await fetch('tracking_health.json?time=' + Date.now());
      if (healthResponse.ok) {
        const health = await healthResponse.json();
        const info = element('p', '自動更新：' + formatDate(health.last_run_at) + (health.pending_count ? ' ／ 判定保留 ' + health.pending_count + '件' : ''), 'description');
        controls.appendChild(info);
      }
    } catch (_) {}
  } catch (error) {
    status.textContent = ''; newsArea.replaceChildren(element('div', 'ニュースを読み込めませんでした。時間を置いて再読み込みしてください。', 'error'));
    console.error(error);
  }
}
loadNews();

</script>

</body>
</html>
