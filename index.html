<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ニュースの現在地</title>

  <style>
    :root {
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#17202a;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#2563eb;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI","Noto Sans JP",sans-serif;
    }

    header {
      background:#111827;
      color:white;
      padding:18px 16px;
    }

    .header-inner {
      max-width:900px;
      margin:auto;
    }

    .logo {
      font-size:20px;
      font-weight:800;
    }

    .subtitle {
      margin-top:5px;
      font-size:12px;
      color:#cbd5e1;
    }

    main {
      max-width:900px;
      margin:auto;
      padding:22px 14px 50px;
    }

    .top {
      margin-bottom:20px;
    }

    h1 {
      font-size:25px;
      margin:0 0 7px;
    }

    .description {
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    #status {
      font-size:13px;
      color:var(--muted);
      margin:15px 0;
    }

    .event {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:17px;
      margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
    }

    .event-label {
      display:inline-block;
      font-size:11px;
      font-weight:700;
      color:var(--accent);
      background:#eff6ff;
      border-radius:999px;
      padding:4px 8px;
      margin-bottom:8px;
    }

    .event h2 {
      font-size:18px;
      line-height:1.45;
      margin:0 0 8px;
    }

    .count {
      font-size:12px;
      color:var(--muted);
      margin-bottom:12px;
    }

    .articles {
      border-top:1px solid var(--line);
      padding-top:8px;
    }

    .article {
      padding:9px 0;
      border-bottom:1px solid var(--line);
    }

    .article:last-child {
      border-bottom:0;
    }

    .article a {
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      line-height:1.5;
    }

    .article a:hover {
      color:var(--accent);
    }

    .date {
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }

    .error {
      background:#fff;
      border:1px solid #fecaca;
      border-radius:12px;
      padding:15px;
      color:#991b1b;
    }

    footer {
      text-align:center;
      color:var(--muted);
      font-size:11px;
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">ニュースの現在地</div>
    <div class="subtitle">
      バラバラの報道を、ひとつの出来事として追う
    </div>
  </div>
</header>

<main>

  <div class="top">
    <h1>札幌のニュース</h1>

    <div class="description">
      複数の報道をAIで整理し、
      同じ事件・出来事ごとにまとめています。
    </div>
  </div>

  <div id="status">
    ニュースを読み込んでいます…
  </div>

  <div id="news"></div>

</main>

<footer>
  ニュースの現在地 β
</footer>

<script>

async function loadNews() {

  const status = document.getElementById("status");
  const newsArea = document.getElementById("news");

  try {

    const response = await fetch(
      "news_groups_ai.json?time=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("データを取得できませんでした");
    }

    const groups = await response.json();

    status.textContent =
      groups.length + "件の出来事を表示しています";

    groups.forEach((group, index) => {

      const card = document.createElement("section");
      card.className = "event";

      const label = document.createElement("div");
      label.className = "event-label";
      label.textContent = "追跡中";

      const title = document.createElement("h2");
      title.textContent =
        group.event_name || "名称未設定";

      const count = document.createElement("div");
      count.className = "count";
      count.textContent =
        group.article_count + "件の関連記事";

      const articles = document.createElement("div");
      articles.className = "articles";

      group.articles.forEach(article => {

        const item = document.createElement("div");
        item.className = "article";

        const link = document.createElement("a");
        link.href = article.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = article.title;

        const date = document.createElement("div");
        date.className = "date";

        if (article.published) {
          const d = new Date(article.published);

          if (!isNaN(d)) {
            date.textContent =
              d.toLocaleString("ja-JP");
          }
        }

        item.appendChild(link);
        item.appendChild(date);

        articles.appendChild(item);

      });

      card.appendChild(label);
      card.appendChild(title);
      card.appendChild(count);
      card.appendChild(articles);

      newsArea.appendChild(card);

    });

  } catch (error) {

    status.textContent = "";

    newsArea.innerHTML =
      '<div class="error">' +
      'ニュースを読み込めませんでした。' +
      '</div>';

    console.error(error);

  }

}

loadNews();

</script>

</body>
</html>
