name: Sapporo News Collector

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Sapporo news
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://news.google.com/rss/search?q=%E6%9C%AD%E5%B9%8C&hl=ja&gl=JP&ceid=JP:ja"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("sapporo_news.xml", "wb") as f:
              f.write(data)

          print("札幌ニュースを取得しました")
          PY
          
      - name: Convert news to JSON
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import json
          import html

          tree = ET.parse("sapporo_news.xml")
          root = tree.getroot()

          news = []

          for item in root.findall(".//item"):
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              pub_date = item.findtext("pubDate", "")
              description = item.findtext("description", "")

              news.append({
                  "title": html.unescape(title),
                  "url": link,
                  "published": pub_date,
                  "description": html.unescape(description)
              })

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"{len(news)}件のニュースを整理しました")
          PY
          
      - name: Group news
        run: |
          python ai_candidates.py

      - name: AI news grouping
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("ai_candidates.json", "r", encoding="utf-8") as f:
              candidates = json.load(f)

          results = []

          for candidate in candidates[:20]:
              prompt = f"""
          次の2つのニュース記事が、同じ事件・出来事について報じているか判定してください。

          【記事A】
          タイトル: {candidate["article_a"]["title"]}
          公開日時: {candidate["article_a"]["published"]}

          【記事B】
          タイトル: {candidate["article_b"]["title"]}
          公開日時: {candidate["article_b"]["published"]}

          以下のJSONだけを返してください。
          {{
            "relation": "same_event / related / different",
            "event_name": "事件・出来事の短い名前",
            "confidence": "high / medium / low"
          }}

          same_event = 同じ事件・出来事
          related = 関連はあるが別の出来事
          different = 無関係
          """

              data = json.dumps({
                  "model": "gpt-5.4-mini",
                  "input": prompt
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.openai.com/v1/responses",
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      response_data = json.loads(response.read().decode("utf-8"))

                  result_text = response_data["output"][0]["content"][0]["text"]

                  results.append({
                      "article_a": candidate["article_a"],
                      "article_b": candidate["article_b"],
                      "ai_result": result_text
                  })

              except Exception as e:
                  print("AI判定エラー:", e)

          with open("ai_results.json", "w", encoding="utf-8") as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{len(results)}組のニュースをAI判定しました")
          PY

      - name: Create AI news groups
        run: |
          python news_ai_grouping.py
          
      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sapporo_news.xml news.json news_groups.json ai_candidates.json ai_results.json news_groups_ai.json

          git commit -m "Update Sapporo news" || echo "No changes"

          git push
