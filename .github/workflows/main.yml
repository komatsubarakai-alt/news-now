name: Sapporo News Collector

concurrency:
  group: sapporo-news-collector
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      resume_after_topup:
        description: "チャージ後にAPI停止を解除（予算はリセットしません）"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"

env:
  AI_DAILY_USD_LIMIT: "0.20"
  AI_MONTHLY_USD_LIMIT: "5.00"
  AI_DAILY_CALL_LIMIT: "40"
  AI_RUN_CALL_LIMIT: "24"
  AI_MAX_OUTPUT_TOKENS: "1200"
  PAIR_CALL_LIMIT: "4"
  MERGE_CALL_LIMIT: "2"
  STATUS_GROUP_LIMIT: "4"
  TRACKING_CALL_LIMIT: "8"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test tracking engine
        run: python -m unittest discover -s tests -v

      - name: Get Sapporo news
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://news.google.com/rss/search?q=%E6%9C%AD%E5%B9%8C&hl=ja&gl=JP&ceid=JP:ja"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("sapporo_news.xml", "wb") as f:
              f.write(data)

          print("札幌ニュースを取得しました")
          PY
          
      - name: Preserve sources and filter verified reprints before AI
        run: python source_filter.py --rss sapporo_news.xml

      - name: Check AI processing interval
        id: ai_gate
        env:
          AI_RESUME_AFTER_TOPUP: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_after_topup && 'true' || 'false' }}
        run: python ai_cost_control.py

      - name: Group news
        if: steps.ai_gate.outputs.enabled == 'true'
        run: |
          python ai_candidates.py

      - name: AI news grouping
        if: steps.ai_gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python news_pairing.py

      - name: Create AI news groups
        if: steps.ai_gate.outputs.enabled == 'true'
        run: |
          python news_ai_grouping.py

      - name: Merge follow-up news groups
        if: steps.ai_gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python news_group_merge.py

      - name: Remove duplicate articles
        if: steps.ai_gate.outputs.enabled == 'true'
        run: |
          python news_deduplicate.py

      - name: Create news status
        if: steps.ai_gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python news_status.py

      - name: Track long-term events
        if: steps.ai_gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python event_tracker.py

      - name: Clear collected inbox after successful AI processing
        if: steps.ai_gate.outputs.enabled == 'true'
        run: python -c "from tracking_v1 import atomic_save; atomic_save('news_inbox.json', [])"

      - name: Save news data
        if: always() && steps.ai_gate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai_budget.json news_inbox.json
          if [ -f ai_response_cache.json ]; then
            git add ai_response_cache.json
          fi
          git add sapporo_news.xml news.json news_filtered.json news_source_metrics.json source_exclusions.json news_groups.json ai_candidates.json ai_results.json news_groups_ai.json news_groups_merged.json news_groups_deduplicated.json news_status.json events.json public_events.json tracking_pending.json tracking_triage.json tracking_review_recent.json tracking_health.json merge_review.json status_pending.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Sapporo news"
          fi

          git pull --rebase origin main
          git push
