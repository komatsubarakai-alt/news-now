name: Sapporo News Collector
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Sapporo news
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://news.google.com/rss/search?q=%E6%9C%AD%E5%B9%8C&hl=ja&gl=JP&ceid=JP:ja"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("sapporo_news.xml", "wb") as f:
              f.write(data)

          print("札幌ニュースを取得しました")
          PY

      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sapporo_news.xml
          git commit -m "Update Sapporo news" || echo "No changes"
          git push
